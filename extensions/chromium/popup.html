<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0F172A;
      color: #F8FAFC;
      margin: 0;
    }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .brand { font-size: 14px; font-weight: 800; color: #4F46E5; }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 700;
    }
    .connected { background: rgba(16, 185, 129, 0.2); color: #10B981; }
    .disconnected { background: rgba(239, 68, 68, 0.2); color: #EF4444; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .card { background: #1E293B; border-radius: 12px; padding: 12px; margin-bottom: 12px; }
    .label { font-size: 10px; font-weight: 700; color: #94A3B8; text-transform: uppercase; margin-bottom: 4px; }
    .value { font-size: 15px; font-weight: 800; }
    .footer { font-size: 10px; color: #64748B; text-align: center; }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">Quietora Focus</div>
    <div id="status" class="status-badge disconnected"><span class="dot"></span> Disconnected</div>
  </div>
  <div class="card">
    <div class="label">Focus Status</div>
    <div id="focusState" class="value">Idle</div>
  </div>
  <div class="card">
    <div class="label">Active Shield Policy</div>
    <div id="policyInfo" class="value">Browser Shield Ready</div>
  </div>
  <div class="footer">QuietoraLabs — v4.0 Student OS</div>
  <script src="popup.js"></script>
</body>
</html>
